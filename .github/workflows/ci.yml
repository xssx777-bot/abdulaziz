name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [stockvista-simple, stockvista-full]

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    env:
      # The apps read these at build time; the values are throwaway and the
      # database is never connected to during a build.
      AUTH_SECRET: ci_build_secret_not_used_at_runtime
      DATABASE_URL: "file:./dev.db"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # --if-present: stockvista-simple has no test script yet, and a missing
      # one should not fail its job.
      - name: Test
        run: npm test --if-present

      - name: Build
        run: npx next build
